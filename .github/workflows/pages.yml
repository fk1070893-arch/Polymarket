name: Publier le site

on:
  push:
  schedule:
    - cron: "*/5 * * * *" # instantané des marchés toutes les 5 minutes (minimum autorisé par GitHub)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Publie uniquement depuis la branche par défaut du dépôt
    if: github.ref_name == github.event.repository.default_branch || github.event_name != 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les marchés Polymarket
        run: node scripts/build-snapshot.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
