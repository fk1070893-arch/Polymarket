name: Publier le site

on:
  push:
  schedule:
    - cron: "*/5 * * * *" # instantané des marchés toutes les 5 minutes
  workflow_dispatch:
    inputs:
      backtest:
        description: "Recalculer le backtest maintenant"
        type: boolean
        default: false

permissions:
  contents: write # pour enregistrer la mémoire des tests dans la branche « etat »
  pages: write
  id-token: write

# Un seul passage à la fois, manuel ou automatique : deux passages
# simultanés reliraient la même mémoire et le second effacerait les paris
# enregistrés par le premier. Les suivants attendent leur tour (GitHub n'en
# garde qu'un en attente).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Publie uniquement depuis la branche par défaut du dépôt
    if: github.ref_name == github.event.repository.default_branch || github.event_name != 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      # Début du passage, pour le suivi rapide des alertes en fin de passage
      - name: Heure de début
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      # Mémoire des tests en direct (paris pris, caches…), gardée dans la
      # branche « etat », indépendante du site publié
      - name: Récupérer la mémoire des tests
        run: |
          mkdir -p .state
          # Si la branche existe mais ne se lit pas (panne réseau), on arrête :
          # repartir de zéro écraserait la mémoire au moment de l'enregistrer
          set +e
          git ls-remote --exit-code --heads origin etat >/dev/null
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            git fetch -q --depth 1 origin etat
            git archive FETCH_HEAD | tar -x -C .state
            echo "Mémoire récupérée : $(ls .state | wc -l) fichiers"
          elif [ "$code" -eq 2 ]; then
            echo "Pas encore de mémoire : reprise depuis le site publié"
          else
            echo "::error::Branche « etat » illisible (code $code) : passage arrêté pour ne pas perdre la mémoire"
            exit 1
          fi

      # PAGES_URL permet aux scripts de relire l'état de la publication précédente
      - name: Récupérer les marchés Polymarket
        run: node scripts/build-snapshot.mjs
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      # Tous les événements ouverts, lus une seule fois et partagés par les
      # étapes suivantes (si elle échoue, chacune relit l'API elle-même)
      - name: Lire tous les événements Polymarket
        run: node scripts/build-universe.mjs
        continue-on-error: true
        timeout-minutes: 5

      - name: Calendrier (fins de marché et résultats récents)
        run: node scripts/build-calendar.mjs
        continue-on-error: true
        timeout-minutes: 2

      - name: Classement des meilleurs traders
        run: node scripts/build-leaders.mjs
        continue-on-error: true
        timeout-minutes: 2
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - name: Détecter les paris suspects
        run: node scripts/build-alerts.mjs
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - name: Modèle crypto (options Deribit)
        run: node scripts/build-crypto.mjs
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - name: Test en direct de la stratégie (favoris sport)
        run: node scripts/build-strategy.mjs
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - name: Test en direct - copier les paris suspects
        run: node scripts/build-copy.mjs
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - name: Bilan des alertes (si on les avait toutes suivies)
        run: node scripts/build-alerts-review.mjs
        continue-on-error: true
        timeout-minutes: 2

      # D'où vient l'argent des wallets suspects (founder, relais, origine)
      - name: Pistes des wallets suspects
        run: node scripts/build-wallets.mjs
        continue-on-error: true
        timeout-minutes: 4
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

      - name: Test en direct - marchés tout neufs
        run: node scripts/build-fresh.mjs
        continue-on-error: true
        timeout-minutes: 5
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - name: Anomalies de prix (issues exclusives)
        run: node scripts/build-arbs.mjs
        continue-on-error: true
        timeout-minutes: 6
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      # Mêmes questions sur Kalshi et Metaculus (réutilise les marchés lus juste avant)
      - name: Comparaison Kalshi et Metaculus
        run: node scripts/build-cross.mjs
        continue-on-error: true
        timeout-minutes: 4
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}

      # Clé gratuite The Odds API dans le secret ODDS_API_KEY (jamais affichée) ;
      # sans clé, l'étape se contente de régler les paris déjà pris
      - name: Test en direct - sport contre bookmakers
        run: node scripts/build-odds.mjs
        continue-on-error: true
        timeout-minutes: 5
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # Secrets TELEGRAM_BOT_TOKEN et TELEGRAM_CHAT_ID (jamais affichés) ;
      # sans eux, l'étape ne fait rien
      # Plusieurs bots fictifs, chacun branché sur un signal, pour comparer
      - name: Arène des bots
        run: node scripts/build-bots.mjs
        continue-on-error: true
        timeout-minutes: 4

      - name: Alertes Telegram
        run: node scripts/build-notify.mjs
        continue-on-error: true
        timeout-minutes: 2
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Facultatif : variable (pas secret) listant les alertes voulues
          TELEGRAM_TYPES: ${{ vars.TELEGRAM_TYPES }}

      # Recalculé une fois par semaine (ou à la demande), sinon republié tel quel
      - name: Backtest sur les marchés terminés
        run: node scripts/build-backtest.mjs
        continue-on-error: true
        timeout-minutes: 19
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          BACKTEST_FORCE: ${{ inputs.backtest }}

      # GitHub ne lance pas de passage plus d'une fois toutes les 5 minutes :
      # on occupe la fin du passage à relire les paris suspects toutes les
      # minutes (et à les copier au prix du moment), pour les voir au plus
      # tôt. S'arrête vers 4 min 30 de passage, avant le passage suivant.
      - name: Suivi rapide des alertes (toutes les minutes)
        continue-on-error: true
        timeout-minutes: 6
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          n=0
          while :; do
            next=$(( $(date +%s) + 60 ))
            [ $(( next - RUN_START )) -lt 270 ] || break
            sleep $(( next - $(date +%s) ))
            n=$(( n + 1 ))
            echo "::group::Relecture $n"
            node scripts/build-alerts.mjs || true
            node scripts/build-copy.mjs || true
            BOTS_FAST=1 node scripts/build-bots.mjs || true
            echo "::endgroup::"
          done
          echo "$n relecture(s) supplémentaire(s) des alertes"

      # Enregistrée même si une étape ou la publication échoue
      - name: Enregistrer la mémoire des tests
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .state
          [ -n "$(ls -A)" ] || { echo "Rien à enregistrer"; exit 0; }
          # Un seul commit, remplacé à chaque passage : la branche reste légère
          rm -rf .git
          git init -q -b etat
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Mémoire des tests en direct"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" etat
          echo "Mémoire enregistrée : $(ls | wc -l) fichiers, $(du -sh . | cut -f1)"

      # Chaque publication donne un nouveau nom de version aux fichiers du site,
      # pour que les navigateurs ne gardent pas l'ancien code en mémoire
      - name: Version des fichiers du site
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(from \"\./[a-z-]+\.js)\"#\1?v=$v\"#g" site/js/*.js
          sed -i -E "s#(src=\"js/app\.js)\"#\1?v=$v\"#; s#(href=\"css/style\.css)\"#\1?v=$v\"#" site/index.html
          sed -i "s/const VERSION = \"dev\";/const VERSION = \"$v\";/" site/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
