name: Publier le site

on:
  push:
  schedule:
    - cron: "*/15 * * * *" # instantané des marchés toutes les 15 minutes
  workflow_dispatch:
    inputs:
      backtest:
        description: "Recalculer le backtest maintenant"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication automatique à la fois ; les suivantes attendent
# leur tour (sinon, avec une exécution toutes les 15 min, aucune n'irait au
# bout). Les lancements manuels ont leur propre file : GitHub ne garde
# qu'une exécution en attente par file, et un passage automatique
# remplacerait sinon un recalcul demandé à la main.
concurrency:
  group: pages-${{ github.event_name == 'workflow_dispatch' && 'manuel' || 'auto' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Publie uniquement depuis la branche par défaut du dépôt
    if: github.ref_name == github.event.repository.default_branch || github.event_name != 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      # PAGES_URL permet aux scripts de relire l'état de la publication précédente
      - name: Récupérer les marchés Polymarket
        run: node scripts/build-snapshot.mjs
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - name: Détecter les paris suspects
        run: node scripts/build-alerts.mjs
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - name: Modèle crypto (options Deribit)
        run: node scripts/build-crypto.mjs
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - name: Test en direct de la stratégie (favoris sport)
        run: node scripts/build-strategy.mjs
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - name: Test en direct - copier les paris suspects
        run: node scripts/build-copy.mjs
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - name: Anomalies de prix (issues exclusives)
        run: node scripts/build-arbs.mjs
        continue-on-error: true
        timeout-minutes: 5
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      # Clé gratuite The Odds API dans le secret ODDS_API_KEY (jamais affichée) ;
      # sans clé, l'étape se contente de régler les paris déjà pris
      - name: Test en direct - sport contre bookmakers
        run: node scripts/build-odds.mjs
        continue-on-error: true
        timeout-minutes: 5
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # Recalculé au plus une fois par jour (ou à la demande), sinon republié tel quel
      - name: Backtest sur les marchés terminés
        run: node scripts/build-backtest.mjs
        continue-on-error: true
        timeout-minutes: 15
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          BACKTEST_FORCE: ${{ inputs.backtest }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
