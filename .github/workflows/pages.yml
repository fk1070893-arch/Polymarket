name: Publier le site

on:
  push:
  schedule:
    - cron: "*/5 * * * *" # instantané des marchés toutes les 5 minutes (minimum autorisé par GitHub)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les suivantes attendent leur tour
# (sinon, avec une exécution toutes les 5 min, aucune n'irait au bout).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Publie uniquement depuis la branche par défaut du dépôt
    if: github.ref_name == github.event.repository.default_branch || github.event_name != 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      # PAGES_URL permet aux scripts de relire l'état de la publication précédente
      - name: Récupérer les marchés Polymarket
        run: node scripts/build-snapshot.mjs
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - name: Détecter les paris suspects
        run: node scripts/build-alerts.mjs
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
